name: Web CI

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.201'

      - name: Restore dependencies
        run: dotnet restore AnxietyWatch.Web.sln

      - name: Audit dependencies
        run: dotnet list AnxietyWatch.Web.sln package --vulnerable --include-transitive --no-restore

      - name: Verify formatting
        run: dotnet format AnxietyWatch.Web.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build AnxietyWatch.Web.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test AnxietyWatch.Web.sln --configuration Release --no-build

      - name: Scan repository secrets
        uses: trufflesecurity/trufflehog@v3.90.8
        with:
          version: 3.90.8
          extra_args: --results=verified,unknown

      - name: Publish server app
        run: dotnet publish AnxietyWatch.Web/AnxietyWatch.Web.csproj --configuration Release --no-build --output ./publish

      - name: Smoke test published app
        shell: bash
        run: |
          (
            cd publish
            dotnet AnxietyWatch.Web.dll --urls http://127.0.0.1:5080
          ) > /tmp/anxietywatch-web.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5080/healthz > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5080/healthz > /dev/null
          curl --fail --silent http://127.0.0.1:5080/_framework/blazor.web.js > /dev/null
          curl --fail --silent --max-time 20 http://127.0.0.1:5080/api/plans > /dev/null

      - name: Build Docker image
        run: docker build --tag anxietywatch-web:ci .

      - name: Upload publish artifact
        uses: actions/upload-artifact@v7
        with:
          name: anxietywatch-web
          path: ./publish
          if-no-files-found: error
